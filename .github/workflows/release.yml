name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    name: Universal macOS DMG
    needs: checks
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Platform/macOS-Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
          test -s "docs/releases/$RELEASE_TAG.md"
      - name: Build and verify universal DMG
        run: ./scripts/package-dmg.sh
      - name: Preserve build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Draft first so a failed upload never exposes an incomplete release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "禅 · Zen $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
